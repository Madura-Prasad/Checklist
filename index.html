<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Checklist</title>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 5px;
        }

        header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 768px) {
            .checklist-grid {
                grid-template-columns: 1fr;
            }
        }

        .checklist-card {
            background: #1e293b;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .card-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .card-title i {
            font-size: 1.2rem;
            margin-right: 10px;
            color: #8b5cf6;
        }

        .card-title h2 {
            font-size: 1.3rem;
            color: #f1f5f9;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            background-color: #334155;
            color: #f1f5f9;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #8b5cf6;
        }

        .bias-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            background: #2d3748;
            border-radius: 8px;
            padding: 12px;
            border: 2px solid transparent;
        }

        .bias-indicator.good {
            border-color: #10b981;
            background-color: rgba(16, 185, 129, 0.1);
        }

        .bias-indicator.bad {
            border-color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
        }

        .bias-item {
            text-align: center;
            flex: 1;
        }

        .bias-item h3 {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .bias-value {
            font-size: 1rem;
            font-weight: 700;
        }

        .validation-container {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid #334155;
        }

        .validation-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .validation-header h2 {
            font-size: 1.3rem;
            color: #f1f5f9;
        }

        .reset-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reset-btn:hover {
            background: #475569;
        }

        /* Validation */
        .validation-container {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #334155;
        }

        .validation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .reset-btn {
            background: #334155;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            color: white;
        }

        .validation-result {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            min-height: 120px;
            border: 2px dashed #475569;
        }

        .validation-good {
            border: 2px solid #10b981;
            background-color: rgba(34, 197, 94, 0.1);
        }

        .validation-bad {
            border: 2px solid #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            header h1 {
                font-size: 1.6rem;
            }

            .checklist-card {
                padding: 15px;
            }
        }

        .warning-message {
            background-color: rgba(245, 158, 11, 0.1);
            border-left: 4px solid #f59e0b;
            padding: 12px;
            margin-top: 15px;
            border-radius: 0 6px 6px 0;
            display: none;
        }

        .warning-message p {
            color: #fbbf24;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .checklist-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #334155;
            color: #94a3b8;
            font-size: 0.8rem;
        }

        /* Quote Section */
        .quote-card {
            background: #1e293b;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .quote-card ul {
            padding-left: 20px;
        }

        .quote-card li {
            color: #ff5c5c;
            font-style: italic;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-clipboard-check"></i> Checklist</h1>
        </header>
        <!-- Quote Section -->
        <div class="quote-card">
            <ul>
                <li>No displacement = No Trade</li>
                <li>Sweep → Displacement → FVG → Pullback → Enter</li>
            </ul>
        </div>

        <div class="checklist-grid">
            <!-- Left Column -->
            <div class="checklist-card">
                <div class="card-title">
                    <i class="fas fa-chart-line"></i>
                    <h2>Market Bias</h2>
                </div>

                <div class="bias-indicator" id="bias-indicator">
                    <div class="bias-item">
                        <h3>HTF BIAS</h3>
                        <div class="bias-value" id="htf-bias-value">-</div>
                    </div>
                    <div class="bias-item">
                        <h3>PREMIUM/DISCOUNT</h3>
                        <div class="bias-value" id="premium-discount-value">-</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="htf-bias">HTF BIAS</label>
                        <select id="htf-bias">
                            <option value="">Select</option>
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="premium-discount">Premium/Discount</label>
                        <select id="premium-discount">
                            <option value="">Select</option>
                            <option value="BUY">BUY</option>
                            <option value="SELL">SELL</option>
                        </select>
                    </div>
                </div>

            </div>

            <!-- Right Column -->
            <div class="checklist-card">
                <div class="card-title">
                    <i class="fas fa-filter"></i>
                    <h2>Confirmation Factors</h2>
                </div>

                <div class="form-group">
                    <label for="htf-poi">HTF POI</label>
                    <select id="htf-poi">
                        <option value="">Select</option>
                        <option value="FVG">FVG</option>
                        <option value="OB">OB</option>
                        <option value="BB">BB</option>
                        <option value="IFVG">IFVG</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="liq-sweep">Liquidity Sweep</label>
                        <select id="liq-sweep">
                            <option value="">Select</option>
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="candle-close">Candle Close on MSS (HTF PD Array Rejection)</label>
                        <select id="candle-close">
                            <option value="">Select</option>
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="displacement">Displacement</label>
                        <select id="displacement">
                            <option value="">Select</option>
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rejection">FVG</label>
                        <select id="rejection">
                            <option value="">Select</option>
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="smt">SMT</label>
                        <select id="smt">
                            <option value="">Select</option>
                            <option value="YES">YES</option>
                            <option value="NO">NO</option>
                        </select>
                    </div>
                </div>

                <div class="warning-message" id="no-entry-warning">
                    <p><i class="fas fa-exclamation-triangle"></i> Warning: One or more factors indicate NO ENTRY</p>
                </div>
            </div>
        </div>

        <!-- Validation Result -->
        <div class="validation-container">
            <div class="validation-header">
                <h2>Trade Validation</h2> <button class="reset-btn" id="reset-btn"> <i class="fas fa-redo-alt"></i> Reset All </button>
            </div>
            <div class="validation-result validation-pending" id="validation-result">
                <div class="validation-content">
                    <div class="validation-title">Complete Checklist</div>
                    <div class="validation-details">Fill all fields above to validate trade setup</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const htfBiasSelect = document.getElementById('htf-bias');
        const premiumDiscountSelect = document.getElementById('premium-discount');
        const htfPoiSelect = document.getElementById('htf-poi');
        const displacementSelect = document.getElementById('displacement');
        const rejectionSelect = document.getElementById('rejection');
        const liqSweepSelect = document.getElementById('liq-sweep');
        const smtSelect = document.getElementById('smt');
        const candleCloseSelect = document.getElementById('candle-close');
        const oteSelect = document.getElementById('ote');

        // Display elements
        const htfBiasValue = document.getElementById('htf-bias-value');
        const premiumDiscountValue = document.getElementById('premium-discount-value');
        const biasIndicator = document.getElementById('bias-indicator');
        const noEntryWarning = document.getElementById('no-entry-warning');
        const validationResult = document.getElementById('validation-result');
        const resetBtn = document.getElementById('reset-btn');

        // Initialize event listeners
        function init() {
            // Add change listeners to all selects
            const allSelects = [
                htfBiasSelect, premiumDiscountSelect,
                htfPoiSelect, displacementSelect, rejectionSelect,
                liqSweepSelect, smtSelect, candleCloseSelect, oteSelect
            ];

            allSelects.forEach(select => {
                select.addEventListener('change', validateTrade);
            });

            // Reset button
            resetBtn.addEventListener('click', resetChecklist);

            // Initialize with sample data (optional - remove for production)

        }

        // Main validation function
        function validateTrade() {
            // Get all values
            const values = {
                htfBias: htfBiasSelect.value,
                premiumDiscount: premiumDiscountSelect.value,
                htfPoi: htfPoiSelect.value,
                displacement: displacementSelect.value,
                rejection: rejectionSelect.value,
                liqSweep: liqSweepSelect.value,
                smt: smtSelect.value,
                candleClose: candleCloseSelect.value
            };

            // Update bias indicator display
            updateBiasDisplay(values);

            // Check if all fields are filled
            const allFilled = Object.values(values).every(value => value !== '');

            if (!allFilled) {
                showResult('pending', 'Complete Checklist', 'Fill all fields above to validate trade setup');
                noEntryWarning.style.display = 'none';
                return;
            }

            // Check for NO entries - CRITICAL FIX: Changed from checking for "NO" to checking ALL must be "YES"
            const noEntryFactors = [
                values.displacement,
                values.rejection,
                values.liqSweep,
                values.smt,
                values.candleClose
            ].filter(value => value === 'NO');

            // Check bias alignment
            const biasAligned = values.htfBias === values.premiumDiscount;

            // NEW: Check if ALL YES/NO factors are "YES" (not just not "NO")
            const allYesFactors = [
                values.displacement,
                values.rejection,
                values.liqSweep,
                values.smt,
                values.candleClose
            ].every(value => value === 'YES');

            // Determine validation result - UPDATED LOGIC
            if (noEntryFactors.length > 0) {
                // At least one factor is "NO"
                const factorNames = getFactorNames(noEntryFactors, values);
                showResult('bad', 'NO TRADE CONFIRMATION',
                    `${noEntryFactors.length} rejection factor(s): ${factorNames}`);
                noEntryWarning.style.display = 'block';
            } else if (!allYesFactors) {
                // Not all factors are "YES" (some might be empty or other values)
                showResult('bad', 'INCOMPLETE SETUP',
                    'All confirmation factors must be set to YES');
                noEntryWarning.style.display = 'none';
            } else if (!biasAligned) {
                // Bias mismatch
                showResult('bad', 'BIAS MISMATCH',
                    'HTF BIAS, Premium/Discount, and BIAS AI do not align');
                noEntryWarning.style.display = 'none';
            } else if (!values.htfPoi) {
                // No POI selected
                showResult('bad', 'POI REQUIRED',
                    'HTF POI must be selected');
                noEntryWarning.style.display = 'none';
            } else {
                // ALL CONDITIONS MET: All biases align, POI selected, ALL factors are YES
                showResult('good', 'TRADE CONFIRMED',
                    `All factors aligned for ${values.htfBias} at ${values.htfPoi} POI`);
                noEntryWarning.style.display = 'none';
            }
        }

        // Update bias display
        function updateBiasDisplay(values) {
            htfBiasValue.textContent = values.htfBias || '-';
            premiumDiscountValue.textContent = values.premiumDiscount || '-';


            // Check if all bias fields have values
            const biasFilled = values.htfBias && values.premiumDiscount;

            if (biasFilled) {
                const biasAligned = values.htfBias === values.premiumDiscount; 
                biasIndicator.className = biasAligned ? 'bias-indicator good' : 'bias-indicator bad';
            } else {
                biasIndicator.className = 'bias-indicator';
            }
        }

        // Show validation result
        function showResult(type, title, details) {
            const icons = {
                pending: '',
                good: 'fa-check-circle',
                bad: 'fa-times-circle',
                warning: 'fa-exclamation-triangle'
            };

            const colors = {
                pending: 'validation-pending',
                good: 'validation-good',
                bad: 'validation-bad',
                warning: 'validation-warning'
            };

            validationResult.className = `validation-result ${colors[type]}`;
            validationResult.innerHTML = `
                <div class="validation">
    <div class="validation-icon">
        <i class="fas ${icons[type]}"></i>
    </div>
    <div class="validation-content">
        <div class="validation-title">${title}</div>
        <div class="validation-details">${details}</div>
    </div>
</div>

            `;
        }

        // Get factor names for warning message
        function getFactorNames(noFactors, values) {
            const factorMap = {
                displacement: 'Displacement + FVG',
                rejection: 'Rejection',
                liqSweep: 'Liquidity Sweep',
                smt: 'SMT',
                candleClose: 'Candle Close on MSS'
            };

            const names = [];
            Object.keys(factorMap).forEach(key => {
                if (values[key] === 'NO') {
                    names.push(factorMap[key]);
                }
            });

            return names.join(', ');
        }

        // Reset checklist
        function resetChecklist() {
            const allSelects = [
                htfBiasSelect, premiumDiscountSelect,
                htfPoiSelect, displacementSelect, rejectionSelect,
                liqSweepSelect, smtSelect, candleCloseSelect
            ];

            allSelects.forEach(select => {
                select.value = '';
            });

            // Reset displays
            htfBiasValue.textContent = '-';
            premiumDiscountValue.textContent = '-';
            biasIndicator.className = 'bias-indicator';
            noEntryWarning.style.display = 'none';

            showResult('pending', 'Complete Checklist', 'Fill all fields above to validate trade setup');
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
